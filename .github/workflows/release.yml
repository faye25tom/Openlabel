name: Release Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v (e.g. 1.0.3)'
        required: true
        type: string
      draft:
        description: 'Publish as draft release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate & Prepare Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and validate release version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ inputs.version }}"
            VERSION="${RAW_VERSION#v}"
            TAG="v${VERSION}"
            DRAFT="${{ inputs.draft }}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            DRAFT="false"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semver tag/version '$TAG'. Expected vX.Y.Z or vX.Y.Z-rc.1"
            exit 1
          fi

          PRERELEASE="false"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Build production web bundle
        run: npm run build

  build:
    name: Build Installer (${{ matrix.label }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 (NSIS + Portable)
            os: windows-latest
            platform: win
          - label: macOS Universal (DMG + ZIP)
            os: macos-latest
            platform: mac
          - label: Linux x64 (AppImage + DEB)
            os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Run Windows Electron desktop smoke test
        if: matrix.platform == 'win'
        env:
          OPENLABEL_SMOKE_ALLOW_EMPTY_PRINTERS: '1'
        run: npx electron . --smoke-test

      - name: Package desktop installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/build-desktop.mjs --platform ${{ matrix.platform }} --version ${{ needs.validate.outputs.version }}

      - name: List generated release artifacts
        shell: bash
        run: ls -lh release/

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: OpenLabel Studio ${{ needs.validate.outputs.tag }}
          draft: ${{ needs.validate.outputs.draft == 'true' }}
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.validate.outputs.prerelease == 'false' && 'true' || 'false' }}
          generate_release_notes: true
          body: |
            ## OpenLabel Studio ${{ needs.validate.outputs.tag }}

            ### 安装包说明 (Installers)
            - **Windows (x64)**: `OpenLabel-Studio-${{ needs.validate.outputs.version }}-Setup-x64.exe`（标准安装版） / `OpenLabel-Studio-${{ needs.validate.outputs.version }}-Portable-x64.exe`（免安装便携版）
            - **macOS (Apple Silicon & Intel)**: `OpenLabel-Studio-${{ needs.validate.outputs.version }}-macOS-arm64.dmg` / `x64.dmg`（及 `.zip` 归档）
            - **Linux (x64)**: `OpenLabel-Studio-${{ needs.validate.outputs.version }}-Linux-x64.AppImage` / `.deb`
            - **校验文件**: `SHA256SUMS.txt`
          files: |
            release-assets/*
