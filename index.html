    <script>
      // Defensive guard against browser extension injection attempts that fail when reassigning fetch
      try {
        const origFetch = window.fetch;
        if (origFetch) {
          try {
            Object.defineProperty(window, 'fetch', {
              value: origFetch,
              writable: true,
              configurable: true,
              enumerable: true,
            });
          } catch (_) {}
        }
      } catch (_) {}
